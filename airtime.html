<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaPay - Airtime</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dashboard">

<div class="top-section">

<div>
<h2>Buy Airtime</h2>
<p>Recharge any network instantly</p>
</div>

<div class="small-logo">N</div>

</div>

<div class="wallet-info">

<h3>Select Network</h3>

<select class="input-field">
<option>MTN</option>
<option>Airtel</option>
<option>Glo</option>
<option>9mobile</option>
</select>

<h3 style="margin-top:20px;">Phone Number</h3>

<input class="input-field" type="tel" placeholder="08012345678">

<h3 style="margin-top:20px;">Amount (₦)</h3>

<input class="input-field" type="number" placeholder="100">

<h3 style="margin-top:20px;">Wallet Balance</h3>

<p><b>₦0.00</b></p>

<button class="copy-btn">
Buy Airtime
</button>

</div>

<div class="transaction">

<h3>Transaction Preview</h3>

<p>Network: -</p>
<p>Phone: -</p>
<p>Amount: ₦0.00</p>

</div>

</div>

</body>
</html>
