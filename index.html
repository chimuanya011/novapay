<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NovaPay</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

<header class="topHeader">

<div>

<h2 id="greeting">Good Evening 👋</h2>

<p id="welcomeText">Welcome back</p>

</div>

<div id="profileLetter" class="profileCircle">
N
</div>

</header>

<section class="walletCard">

<p class="smallTitle">
Wallet Balance
</p>

<h1 id="walletBalance">
₦0.00
</h1>

<div class="walletButtons">

<button id="addMoneyBtn">

Add Money

</button>

<button id="transferBtn">

Transfer

</button>

</div>

</section> 
<section class="quickServices">

<h2 class="sectionTitle">
Quick Services
</h2>

<div class="servicesGrid">

<button class="serviceCard" id="airtimeCard">

<div class="serviceIcon">📱</div>

<span>Airtime</span>

</button>

<button class="serviceCard" id="dataCard">

<div class="serviceIcon">🌐</div>

<span>Data</span>

</button>

<button class="serviceCard" id="electricityCard">

<div class="serviceIcon">⚡</div>

<span>Electricity</span>

</button>

<button class="serviceCard" id="cableCard">

<div class="serviceIcon">📺</div>

<span>Cable TV</span>

</button>

<button class="serviceCard" id="historyCard">

<div class="serviceIcon">🧾</div>

<span>History</span>

</button>

<button class="serviceCard" id="profileCard">

<div class="serviceIcon">👤</div>

<span>Profile</span>

</button>

</div>

</section> 
<section class="recentActivity">

<h2 class="sectionTitle">
Recent Activity
</h2>

<div class="activityCard">

<div class="activityIcon">
🧾
</div>

<div class="activityInfo">

<h3>No Transactions Yet</h3>

<p>Your recent wallet activities will appear here.</p>

</div>

</div>

</section>

</div>

<nav class="bottomNav">

<button class="navItem active" id="homeBtn">

<span>🏠</span>

<p>Home</p>

</button>

<button class="navItem" id="walletBtn">

<span>💳</span>

<p>Wallet</p>

</button>

<button class="navItem" id="transferNavBtn">

<span>🔄</span>

<p>Transfer</p>

</button>

<button class="navItem" id="profileNavBtn">

<span>👤</span>

<p>Profile</p>

</button>

</nav>

<script type="module" src="index.js"></script>

</body>

</html>
