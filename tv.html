<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaPay - TV Subscription</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dashboard">

<div class="top-section">

<div>
<h2>TV Subscription</h2>
<p>Renew your cable TV subscription</p>
</div>

<div class="small-logo">N</div>

</div>

<div class="wallet-info">

<h3>Select TV Provider</h3>

<select class="input-field">
<option>DStv</option>
<option>GOtv</option>
<option>Startimes</option>
</select>

<h3 style="margin-top:20px;">Select Bouquet</h3>

<select class="input-field">
<option>DStv Compact</option>
<option>DStv Compact Plus</option>
<option>GOtv Max</option>
<option>GOtv Supa</option>
<option>Startimes Basic</option>
<option>Startimes Smart</option>
</select>

<h3 style="margin-top:20px;">Smart Card / IUC Number</h3>

<input class="input-field" type="text" placeholder="Enter Smart Card or IUC Number">

<h3 style="margin-top:20px;">Wallet Balance</h3>

<p><b>₦0.00</b></p>

<button class="copy-btn">
Pay TV
</button>

</div>

<div class="transaction">

<h3>Transaction Preview</h3>

<p>Provider: -</p>
<p>Bouquet: -</p>
<p>Smart Card: -</p>
<p>Amount: ₦0.00</p>

</div>

</div>

</body>
</html>
