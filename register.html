<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account | NovaPay</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="register-container">

<h1>Create Your NovaPay Account</h1>

<p>Create your secure fintech account.</p>

<form id="registerForm">

<input
type="text"
id="fullName"
placeholder="Full Name"
required>

<input
type="tel"
id="phoneNumber"
placeholder="Phone Number"
required>

<input
type="email"
id="email"
placeholder="Email Address"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password"
required>

<button
type="submit">

Create Account

</button>

</form>

<p>

Already have an account?

<a href="login.html">

Login

</a>

</p>

</div>

<script type="module" src="auth.js"></script>

</body>

</html>
