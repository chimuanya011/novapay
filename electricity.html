<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaPay - Electricity</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dashboard">

<div class="top-section">

<div>
<h2>Pay Electricity</h2>
<p>Recharge your prepaid or postpaid meter</p>
</div>

<div class="small-logo">N</div>

</div>

<div class="wallet-info">

<h3>Distribution Company</h3>

<select class="input-field">
<option>IKEDC</option>
<option>EKEDC</option>
<option>AEDC</option>
<option>IBEDC</option>
<option>PHED</option>
<option>KEDCO</option>
<option>KAEDCO</option>
<option>JED</option>
<option>EEDC</option>
</select>

<h3 style="margin-top:20px;">Meter Type</h3>

<select class="input-field">
<option>Prepaid</option>
<option>Postpaid</option>
</select>

<h3 style="margin-top:20px;">Meter Number</h3>

<input class="input-field" type="text" placeholder="Enter meter number">

<h3 style="margin-top:20px;">Amount (₦)</h3>

<input class="input-field" type="number" placeholder="1000">

<h3 style="margin-top:20px;">Wallet Balance</h3>

<p><b>₦0.00</b></p>

<button class="copy-btn">
Pay Electricity
</button>

</div>

<div class="transaction">

<h3>Transaction Preview</h3>

<p>Company: -</p>
<p>Meter: -</p>
<p>Amount: ₦0.00</p>

</div>

</div>

</body>
</html>
