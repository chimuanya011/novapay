<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaPay - Wallet</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dashboard">

<div class="top-section">
<div>
<h2>My Wallet</h2>
<p>Manage your NovaPay balance</p>
</div>

<div class="small-logo">N</div>
</div>


<div class="balance-card">

<p>Available Balance</p>

<h1>₦0.00</h1>

<button>Add Money</button>

</div>


<div class="wallet-info">

<h3>Fund Account</h3>

<p>Transfer money to your NovaPay account using your bank app.</p>

<div class="wallet-detail">
<span>Bank Name</span>
<b>NovaPay Bank</b>
</div>

<div class="wallet-detail">
<span>Account Name</span>
<b>NovaPay User</b>
</div>

<div class="wallet-detail">
<span>Account Number</span>
<b>1234567890</b>
</div>

<button class="copy-btn">
Copy Account Number
</button>

</div>


<h3>Recent Transactions</h3>

<div class="transaction">

<p>No transactions yet</p>

</div>


</div>

</body>
</html>
