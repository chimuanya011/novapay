<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaPay - Buy Data</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dashboard">

<div class="top-section">

<div>
<h2>Buy Data</h2>
<p>Purchase affordable data bundles</p>
</div>

<div class="small-logo">N</div>

</div>

<div class="wallet-info">

<h3>Select Network</h3>

<select class="input-field">
<option>MTN</option>
<option>Airtel</option>
<option>Glo</option>
<option>9mobile</option>
</select>

<h3 style="margin-top:20px;">Select Data Plan</h3>

<select class="input-field">
<option>500MB - ₦150</option>
<option>1GB - ₦300</option>
<option>2GB - ₦600</option>
<option>5GB - ₦1,500</option>
<option>10GB - ₦3,000</option>
</select>

<h3 style="margin-top:20px;">Phone Number</h3>

<input class="input-field" type="tel" placeholder="08012345678">

<h3 style="margin-top:20px;">Wallet Balance</h3>

<p><b>₦0.00</b></p>

<button class="copy-btn">
Buy Data
</button>

</div>

<div class="transaction">

<h3>Transaction Preview</h3>

<p>Network: -</p>
<p>Plan: -</p>
<p>Phone: -</p>
<p>Amount: ₦0.00</p>

</div>

</div>

</body>
</html>
