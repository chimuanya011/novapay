<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaPay - Login</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-container">

<div class="login-card">

<div class="small-logo">N</div>

<h2>Welcome Back</h2>

<p>Login to continue with NovaPay</p>

<input type="text" placeholder="Email Address or Phone Number">

<div class="password-box">
<input type="password" placeholder="Password">
<span>👁</span>
</div>

<div class="options">
<label>
<input type="checkbox">
Remember Me
</label>

<a href="#">Forgot Password?</a>
</div>

<button onclick="window.location.href='dashboard.html'">
Login
</button>

<div class="divider">
<span>or</span>
</div>

<button class="create-btn" onclick="window.location.href='register.html'">
Create New Account
</button>

</div>

</div>

</body>
</html>
