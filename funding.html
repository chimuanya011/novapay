<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Fund Wallet</title>
<link rel="stylesheet" href="funding.css">
</head>

<body>

<body>

<div class="funding-container">

<h1>Fund Wallet</h1>

<p class="subtitle">
Transfer money into the account below to fund your NovaPay wallet.
</p>

<div class="fund-card">

<div class="info">

<div class="label">
Account Name
</div>

<div class="value" id="accountName">
NovaPay User
</div>

</div>

<div class="info">

<div class="label">
Bank Name
</div>

<div class="value">
NovaPay Bank
</div>

</div>

<div class="info">

<div class="label">
Account Number
</div>

<div class="value" id="accountNumber">
Not generated yet
</div>

</div>

<button id="fundingBtn">

Generate Funding Account

</button>

</div>

</div>

</body>
<script>
localStorage.removeItem("novapayAccountNumber");
const accountNumber =
document.getElementById("accountNumber");

const fundingBtn =
document.getElementById("fundingBtn");

let savedAccount =
localStorage.getItem("novapayAccountNumber");

if(savedAccount){

    accountNumber.textContent = savedAccount;

    fundingBtn.textContent = "Copy Account Number";

}

fundingBtn.addEventListener("click",()=>{

    savedAccount =
    localStorage.getItem("novapayAccountNumber");

    if(savedAccount){

        navigator.clipboard.writeText(savedAccount);

        alert("Account Number Copied!");

        return;

    }

    const newAccount =
    Math.floor(
        1000000000 +
        Math.random()*9000000000
    ).toString();

    localStorage.setItem(
        "novapayAccountNumber",
        newAccount
    );

    accountNumber.textContent =
    newAccount;

    fundingBtn.textContent =
    "Copy Account Number";

    alert("Funding Account Generated!");
window.location.reload();
});

</script>

</body>
</html>
